plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

def modVariant = (findProperty('modVariant') ?: 'lite') as String
def variantSuffix = modVariant == 'full' ? '' : '_' + modVariant

// The dance frames and the bundled track are third-party content: they are not
// distributed by this repository, so only a local `content/` folder can supply them.
def bundledContent = file('content')
def hasBundledContent = new File(bundledContent, 'assets/specialist-dance/textures/gui/frames').isDirectory() &&
    new File(bundledContent, 'assets/specialist-dance/sounds/default.ogg').isFile()

if (modVariant == 'full' && !hasBundledContent) {
    throw new GradleException('modVariant=full needs content/ with the dance frames and default.ogg, which this repository does not carry. Run ./gradlew build for the content-free jar that gets published.')
}

sourceSets.main.resources.srcDir(bundledContent)

base {
    archivesName.set("${project.archives_base_name}-v${project.version}-fabric${variantSuffix}-${project.minecraft_version}".toString())
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    archiveVersion.set("")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation "com.tianscar.javasound:javasound-mp3:1.9.8"
    implementation "com.tianscar.javasound:javasound-flac:1.4.1"

    include "com.tianscar.javasound:javasound-mp3:1.9.8"
    include "com.tianscar.javasound:javasound-flac:1.4.1"
    include "com.googlecode.soundlibs:tritonus-share:0.3.7.4"
}

processResources {
    inputs.property "version", project.version
    inputs.property "variant", modVariant
    inputs.files bundledContent

    if (modVariant == 'lite') {
        exclude 'assets/specialist-dance/textures/gui/frames/**'
        exclude 'assets/specialist-dance/sounds**'
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }

    withSourcesJar()
}

tasks.named('sourcesJar') {
    exclude 'assets/specialist-dance/textures/gui/frames/**'
    exclude 'assets/specialist-dance/sounds**'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}