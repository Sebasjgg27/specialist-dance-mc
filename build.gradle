plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
    // Offline fallback: when the Mojang endpoints are unreachable, point Loom at a
    // local mirror of the cached version metadata (e.g. -PloomCustomMetadataUrl=http://127.0.0.1:8765/1.21.11.json)
    if (project.hasProperty("loomCustomMetadataUrl")) {
        customMinecraftMetadata = project.property("loomCustomMetadataUrl")
    }
}

base {
    archivesName.set(project.archives_base_name)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}